name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Prepare APK
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SAFE_TAG="${TAG//\//-}"
          mkdir dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/NetPulse-${SAFE_TAG}.apk"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SAFE_TAG="${TAG//\//-}"
          gh release upload "$TAG" "dist/NetPulse-${SAFE_TAG}.apk" --clobber
